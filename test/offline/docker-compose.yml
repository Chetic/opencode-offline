services:
  opencode-offline:
    build:
      context: ../..
      dockerfile: test/offline/Dockerfile
    entrypoint: ["/bin/bash", "/opt/opencode/test-offline.sh"]
    networks:
      - offline
    # Hardened hosts often mount /tmp noexec; native libraries must still load.
    tmpfs:
      - /tmp:rw,noexec,nosuid
    environment:
      - OPENCODE_OFFLINE_MODE=true
      - OPENCODE_OFFLINE_DEPS_PATH=/opt/opencode/deps
      - OPENCODE_DISABLE_AUTOUPDATE=true
      - OPENCODE_DISABLE_LSP_DOWNLOAD=true
      - OPENCODE_DISABLE_MODELS_FETCH=true
      # Optional local LLM test (see README): requires a network path to the LLM
      - LLM_ENDPOINT=${LLM_ENDPOINT:-}
      - LLM_MODEL=${LLM_MODEL:-}

networks:
  offline:
    driver: bridge
    internal: true  # No outbound internet access
